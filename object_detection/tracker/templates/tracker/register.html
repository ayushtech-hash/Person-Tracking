{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Tracker</title>
  <link rel="stylesheet" href="{% static 'tracker/css/auth.css' %}">
</head>
<body class="auth-body">
  <div class="auth-shell">

    <section class="auth-hud">
      <div class="auth-hud__grid"></div>
      <div>
        <p class="auth-hud__eyebrow">// new operator</p>
        <h1 class="auth-hud__title">Register<br><span>a subject.</span></h1>
        <p class="auth-hud__sub">Create an account to upload footage, run detection and pull reports.</p>
      </div>

      <div class="reticle">
        <span class="reticle__label">subject_new</span>
        <span class="reticle__corner reticle__corner--tl"></span>
        <span class="reticle__corner reticle__corner--tr"></span>
        <span class="reticle__corner reticle__corner--bl"></span>
        <span class="reticle__corner reticle__corner--br"></span>
        <span class="reticle__scanline"></span>
      </div>

      <div class="auth-hud__footer">
        <span>STATUS: <span class="dot">REGISTERING</span></span>
        <span>SESSION: JWT / HTTPONLY</span>
      </div>
    </section>

    <section class="auth-formwrap">
      <div class="auth-card">
        <p class="auth-card__tag">Get started</p>
        <h1>Create account</h1>

        <div class="auth-banner" data-auth-banner></div>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <div class="field__input-wrap">
              <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field__error" data-error-for="username"></div>
          </div>

          <div class="field">
            <label for="email">Email <span style="text-transform:none;color:var(--muted)">(optional)</span></label>
            <div class="field__input-wrap">
              <input type="email" id="email" name="email" autocomplete="email">
            </div>
            <div class="field__error" data-error-for="email"></div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="field__input-wrap">
              <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>
            <div class="field__error" data-error-for="password"></div>
          </div>

          <div class="field">
            <label for="password_confirm">Confirm password</label>
            <div class="field__input-wrap">
              <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required>
            </div>
            <div class="field__error" data-error-for="password_confirm"></div>
          </div>

          <button type="submit" class="auth-submit" data-submit data-idle-label="Create account" data-loading-label="Creating…">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{% url 'login_page' %}">Sign in</a></p>
      </div>
    </section>

  </div>

  <script src="{% static 'tracker/js/auth.js' %}"></script>
</body>
</html>
